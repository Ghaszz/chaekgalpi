<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Diagonal gradient matching site's purple-to-cyan palette -->
    <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#0d0d14"/>

  <!-- Bookmark ribbon shape: classic pointed-bottom bookmark -->
  <!-- Outer bookmark (shadow/glow layer) -->
  <path d="M8 5 H24 V27 L16 22 L8 27 Z" fill="#8b5cf6" opacity="0.18"/>

  <!-- Main bookmark -->
  <path d="M9 4 H23 V26 L16 21.5 L9 26 Z" fill="url(#bm)" filter="url(#glow)"/>

  <!-- Horizontal lines simulating book pages / text -->
  <line x1="12" y1="9"  x2="20" y2="9"  stroke="#0d0d14" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="12" x2="20" y2="12" stroke="#0d0d14" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="15" x2="17" y2="15" stroke="#0d0d14" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

  <!-- Cyan accent dot top-right corner of bookmark -->
  <circle cx="22" cy="6.5" r="2" fill="#38bdf8" opacity="0.85"/>
</svg>